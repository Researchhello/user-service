server:
  port: 8081

spring:
  application:
    name: user-service
  profiles:
    active: dev
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/userdb
    username: cinema
    password: admin123
  hikari:
    connection-timeout: 20000
    maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  # Liquibase Configuration
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    drop-first: false
    contexts: ${spring.profiles.active}
    default-schema: public

  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
    date-format: com.fasterxml.jackson.databind.util.StdDateFormat

eureka:
  client:
    service-url:
      defaultZone: http://eureka:password@localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: true

jwt:
  secret: d93322a3526b5965c8cf7dd5e314fbfd2d83a9145ed2354fde7801f4c391841d4c28d5485497632cad1b20a09f887f2b9593585bd20d192f31bc1d9dd032fd74
  expiration: 86400000 # 24 hours in milliseconds

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.ecommerce.userservice: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
    filter: true
    disable-swagger-default-url: true
    use-root-path: true
  packages-to-scan: com.ecommerce.userservice.controller
  paths-to-match: /api/**
  show-actuator: false

